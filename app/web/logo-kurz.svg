<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 14 292 92" role="img" aria-label="MIRA – Mail · Identity · Routing · Access">
  <defs>
    <!-- Buchstaben: Bögen rund (R), Ecken und Enden eckig -->
    <g id="b" fill="none" stroke-linecap="square" stroke-linejoin="miter" stroke-miterlimit="10">
      <path d="M24 92V28L60 62L96 28V92"/>
      <path d="M124 28V92"/>
      <path d="M150 92V28H183A18 18 0 0 1 183 64H150"/>
      <path d="M166 64H176L204 92" stroke-linejoin="round"/>
      <path d="M228 92V40L240 28H272L284 40V92M228 64H284"/>
    </g>
    <!-- Rand: gleichmäßig rundum, oben etwas heller (Licht von oben) -->
    <linearGradient id="rahmen" x1="0" y1="18" x2="0" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4b4f58"/>
      <stop offset=".5" stop-color="#33363c"/>
      <stop offset="1" stop-color="#202226"/>
    </linearGradient>
    <!-- orange Seele mit weichem Licht oben -->
    <linearGradient id="seele" x1="0" y1="26" x2="0" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset=".35" stop-color="#ffa62b"/>
      <stop offset="1" stop-color="#ff7000"/>
    </linearGradient>
    <!-- Sonnenlicht von oben links -->
    <radialGradient id="sonne" cx="70" cy="10" r="190" gradientUnits="userSpaceOnUse" gradientTransform="translate(70 10) scale(1 .55) translate(-70 -10)">
      <stop offset="0" stop-color="#fff" stop-opacity=".6"/>
      <stop offset=".35" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".7" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="form" maskUnits="userSpaceOnUse" x="0" y="0" width="320" height="150">
      <use href="#b" stroke="#fff" stroke-width="20"/>
    </mask>
    <mask id="kern" maskUnits="userSpaceOnUse" x="0" y="0" width="320" height="150">
      <use href="#b" stroke="#fff" stroke-width="7"/>
    </mask>
  </defs>

  <!-- Rand, gleich breit an allen Seiten -->
  <use href="#b" stroke="url(#rahmen)" stroke-width="20"/>
  <!-- feine Fase innen am Rand -->
  <use href="#b" stroke="#000" stroke-opacity=".35" stroke-width="10"/>

  <!-- orange Seele, leicht gewölbt -->
  <g mask="url(#kern)">
    <use href="#b" stroke="#b54a00" stroke-width="9"/>
    <use href="#b" stroke="url(#seele)" stroke-width="9" transform="translate(0 .9)"/>
  </g>

  <!-- Glanz: als ob die Sonne in Weiß darauf scheint -->
  <rect x="0" y="0" width="320" height="110" fill="url(#sonne)" mask="url(#form)"/>

</svg>
