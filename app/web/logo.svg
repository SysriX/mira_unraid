<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 14 292 132" role="img" aria-label="MIRA – Mail · Identity · Routing · Access">
  <defs>
    <!-- Buchstaben: futuristisch, abgeschrägte Ecken, weich gerundete Kanten -->
    <g id="b" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 92V40L32 28L60 60L88 28L98 40V92"/>
      <path d="M124 28V92"/>
      <path d="M150 92V28H188L200 40V52L188 64H150M182 64L204 92"/>
      <path d="M228 92V40L240 28H272L284 40V92M228 64H284"/>
    </g>
    <!-- Rand: gleichmäßig rundum, oben etwas heller (Licht von oben) -->
    <linearGradient id="rahmen" x1="0" y1="18" x2="0" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4b4f58"/>
      <stop offset=".5" stop-color="#33363c"/>
      <stop offset="1" stop-color="#202226"/>
    </linearGradient>
    <!-- orange Seele mit weichem Licht oben -->
    <linearGradient id="seele" x1="0" y1="26" x2="0" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset=".35" stop-color="#ffa62b"/>
      <stop offset="1" stop-color="#ff7000"/>
    </linearGradient>
    <mask id="kern" maskUnits="userSpaceOnUse" x="0" y="0" width="320" height="150">
      <use href="#b" stroke="#fff" stroke-width="7"/>
    </mask>
  </defs>

  <!-- Rand, gleich breit an allen Seiten -->
  <use href="#b" stroke="url(#rahmen)" stroke-width="20"/>
  <!-- feine Fase innen am Rand -->
  <use href="#b" stroke="#000" stroke-opacity=".35" stroke-width="10"/>

  <!-- orange Seele, leicht gewölbt -->
  <g mask="url(#kern)">
    <use href="#b" stroke="#b54a00" stroke-width="9"/>
    <use href="#b" stroke="url(#seele)" stroke-width="9" transform="translate(0 .9)"/>
    <use href="#b" stroke="#fff" stroke-opacity=".35" stroke-width="2.2" transform="translate(0 -1.8)"/>
  </g>

  <!-- ausgeschrieben -->
  <text x="153" y="130" text-anchor="middle" textLength="262" lengthAdjust="spacing"
        font-family="'Segoe UI Semibold','Segoe UI',Arial,Helvetica,sans-serif" font-size="12.5" font-weight="600"
        fill="#ffffff" stroke="#25272c" stroke-width="2.6" stroke-linejoin="round" paint-order="stroke"
        letter-spacing="1.5">MAIL · IDENTITY · ROUTING · ACCESS</text>
</svg>
