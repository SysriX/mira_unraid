<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 0 306 148" role="img" aria-label="MIRA – Mail · Identity · Routing · Access">
  <defs>
    <!-- Buchstaben als Linien mit spitzen Ecken und eckigen Enden: M I R A -->
    <g id="b" fill="none" stroke-linecap="square" stroke-linejoin="miter" stroke-miterlimit="10">
      <path d="M30 92V30L60 66L90 30V92"/>
      <path d="M122 30V92"/>
      <path d="M154 92V30H186L198 42V56L186 68H154M180 68L202 92"/>
      <path d="M228 92L256 30L284 92M240 72H272"/>
    </g>
    <!-- Rahmen: oben heller, unten dunkler (wirkt aufgesetzt) -->
    <linearGradient id="rahmen" x1="0" y1="18" x2="0" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#555962"/>
      <stop offset=".5" stop-color="#3a3d44"/>
      <stop offset="1" stop-color="#25272c"/>
    </linearGradient>
    <!-- Glanz über das ganze Logo: oben hell, schräger Lichtstreifen -->
    <linearGradient id="glanz" x1="0" y1="18" x2="0" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".46" stop-color="#fff" stop-opacity=".12"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streif" x1="20" y1="20" x2="300" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset=".18" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".26" stop-color="#fff" stop-opacity=".35"/>
      <stop offset=".31" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".62" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".66" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".69" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="schein" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="weich" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <!-- Innenfläche der Schrift: so breit wie der Rand links und rechts -->
    <mask id="kern" maskUnits="userSpaceOnUse" x="0" y="0" width="320" height="150">
      <use href="#b" stroke="#fff" stroke-width="6.5"/>
    </mask>
  </defs>

  <!-- ganz leichter weißer Schein hinter dem Logo -->
  <use href="#b" stroke="#fff" stroke-width="22" opacity=".14" filter="url(#schein)"/>

  <!-- Schatten des Rahmens auf den Untergrund -->
  <use href="#b" stroke="#000" stroke-width="20" opacity=".55" transform="translate(1.5 3)" filter="url(#weich)"/>

  <!-- Rahmen mit Lichtkante oben links -->
  <use href="#b" stroke="#80858f" stroke-width="20" transform="translate(-.6 -.9)"/>
  <use href="#b" stroke="#141518" stroke-width="20" transform="translate(.5 .8)"/>
  <use href="#b" stroke="url(#rahmen)" stroke-width="19"/>

  <!-- schmale weiße Schrift, vom Rahmen leicht überschattet -->
  <g mask="url(#kern)">
    <use href="#b" stroke="#a7abb4" stroke-width="8"/>
    <use href="#b" stroke="#ffffff" stroke-width="8" transform="translate(.8 1.3)"/>
  </g>

  <!-- Glanz über alles -->
  <use href="#b" stroke="url(#glanz)" stroke-width="19"/>
  <use href="#b" stroke="url(#streif)" stroke-width="19"/>

  <!-- ausgeschrieben -->
  <text x="157" y="130" text-anchor="middle" textLength="250" lengthAdjust="spacing"
        font-family="'Segoe UI Semibold','Segoe UI',Arial,Helvetica,sans-serif" font-size="12.5" font-weight="600"
        fill="#ffffff" stroke="#25272c" stroke-width="2.6" stroke-linejoin="miter" paint-order="stroke"
        letter-spacing="1.5">MAIL · IDENTITY · ROUTING · ACCESS</text>
</svg>
