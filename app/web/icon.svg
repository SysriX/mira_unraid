<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="MIRA">
  <defs>
    <!-- Schild: dunkler Metallverlauf, schmaler oranger Rand, Grat -->
    <path id="schild" d="M50 3L84 13L80.5 51Q75 68 50 85Q25 68 19.5 51L16 13Z"/>
    <path id="feld" d="M50 12.2L76.6 20.2L74 48.5Q69.5 60.5 50 72.6Q30.5 60.5 26 48.5L23.4 20.2Z"/>
    <linearGradient id="randmetall" x1="20" y1="5" x2="80" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd27a"/><stop offset=".3" stop-color="#ffa62b"/>
      <stop offset=".7" stop-color="#f07a0a"/><stop offset="1" stop-color="#b85000"/>
    </linearGradient>
    <linearGradient id="feldmetall" x1="25" y1="12" x2="75" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4a4e57"/><stop offset=".5" stop-color="#2a2c32"/><stop offset="1" stop-color="#16171a"/>
    </linearGradient>
    <radialGradient id="licht" cx="38" cy="22" r="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="links" x1="0" y1="6" x2="0" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4a4e57"/>
      <stop offset=".6" stop-color="#2e3036"/>
      <stop offset="1" stop-color="#1f2125"/>
    </linearGradient>
    <linearGradient id="rechts" x1="0" y1="6" x2="0" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#33363d"/>
      <stop offset=".6" stop-color="#202226"/>
      <stop offset="1" stop-color="#141518"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="6" x2="0" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffc04d"/>
      <stop offset=".5" stop-color="#ff9a1a"/>
      <stop offset="1" stop-color="#ff7000"/>
    </linearGradient>
    <linearGradient id="glanz" x1="0" y1="6" x2="0" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="anthrazit" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#555962"/>
      <stop offset="1" stop-color="#25272c"/>
    </linearGradient>
    <!-- Leiterbahnen: waagerecht von der Seite, dann 45° schräg hinter das Schild -->
    <path id="lMail"  d="M10.5 62H16L27 51"/>
    <path id="lIdent" d="M10.5 78H31L42 67"/>
    <path id="lRout"  d="M89.5 78H69L58 67"/>
    <path id="lAcc"   d="M89.5 62H84L73 51"/>
    <g id="bahnen"><use href="#lMail"/><use href="#lIdent"/><use href="#lRout"/><use href="#lAcc"/></g>
    <linearGradient id="pMail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fe0ff"/><stop offset=".5" stop-color="#4dc3ff"/><stop offset="1" stop-color="#1676b8"/></linearGradient>
    <linearGradient id="pIdent" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a8f0c5"/><stop offset=".5" stop-color="#3ddc84"/><stop offset="1" stop-color="#14864a"/></linearGradient>
    <linearGradient id="pRout" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset=".5" stop-color="#ffc233"/><stop offset="1" stop-color="#b9800a"/></linearGradient>
    <linearGradient id="pAcc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffaaaa"/><stop offset=".5" stop-color="#ff5a5a"/><stop offset="1" stop-color="#b52222"/></linearGradient>
    <path id="m" d="M38 58V30L50 42L62 30V58" fill="none" stroke-linecap="square" stroke-linejoin="miter" stroke-miterlimit="10"/>
    <filter id="mschein" filterUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><feGaussianBlur stdDeviation="3.2"/></filter>
    <filter id="mschatten" filterUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><feGaussianBlur stdDeviation="1.6"/></filter>
    <!-- Schild-Spiegelung: höher als beim M, an der Mittelkante geknickt (zwei schräge Flächen) -->
    <mask id="sform" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><use href="#schild" fill="#fff"/></mask>
    <clipPath id="slinks"><rect x="0" y="0" width="50" height="100"/></clipPath>
    <clipPath id="srechts"><rect x="50" y="0" width="50" height="100"/></clipPath>
    <linearGradient id="sspiegel" x1="0" y1="3" x2="0" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".42"/>
      <stop offset=".6" stop-color="#fff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".06"/>
    </linearGradient>
    <mask id="mform" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><use href="#m" stroke="#fff" stroke-width="9.6"/></mask>
    <linearGradient id="mspiegel" x1="0" y1="25" x2="0" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".62"/>
      <stop offset=".55" stop-color="#fff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".14"/>
    </linearGradient>
    <filter id="mbogenweich" filterUnits="userSpaceOnUse" x="-20" y="-80" width="140" height="140"><feGaussianBlur stdDeviation=".3"/></filter>
    <mask id="mkern" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><use href="#m" stroke="#fff" stroke-width="3.4"/></mask>
  </defs>

  <!-- Leiterbahnen hinter dem Schild: Rand gleichmäßig, Seele in Dienstfarbe -->
  <g fill="none" stroke-linejoin="round" stroke-linecap="butt">
    <use href="#bahnen" stroke="#1a1b1f" stroke-width="5"/>
    <use href="#lMail" stroke="#4dc3ff" stroke-width="2.4"/>
    <use href="#lIdent" stroke="#3ddc84" stroke-width="2.4"/>
    <use href="#lRout" stroke="#ffc233" stroke-width="2.4"/>
    <use href="#lAcc" stroke="#ff5a5a" stroke-width="2.4"/>
  </g>

  <!-- Schild: schmaler oranger Rand, ganzes Feld im dunklen Verlauf, Grat, Fase -->
  <use href="#schild" fill="url(#randmetall)" stroke="#1a1b1f" stroke-width="2.2" stroke-linejoin="round"/>
  <g transform="translate(50 44) scale(.925) translate(-50 -44)">
    <use href="#schild" fill="#0d0e10" transform="translate(0 -.8)"/>
    <use href="#schild" fill="url(#feldmetall)"/>
    <path d="M50 3V85" stroke="#000" stroke-opacity=".35" stroke-width="1"/>
    <path d="M50 3V85" stroke="#fff" stroke-opacity=".12" stroke-width=".8" transform="translate(-.8 0)"/>
    <path d="M50 3L16 13L19.5 51Q25 68 50 85Z" fill="#fff" fill-opacity=".05"/>
    <use href="#schild" fill="url(#licht)"/>
    <use href="#schild" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width=".7" transform="translate(0 .6)"/>
  </g>

  <!-- Spiegelung der Sonne auf dem Schild: höher als auf dem M, folgt den zwei Schildflächen -->
  <g mask="url(#sform)">
    <g clip-path="url(#slinks)">
      <ellipse cx="48" cy="-15" rx="42" ry="51" transform="rotate(-8 48 -15)" fill="url(#sspiegel)" filter="url(#mbogenweich)"/>
    </g>
    <g clip-path="url(#srechts)" opacity=".7">
      <ellipse cx="48" cy="-15" rx="42" ry="51" transform="translate(0 -1.6) rotate(-8 48 -15)" fill="url(#sspiegel)" filter="url(#mbogenweich)"/>
    </g>
  </g>

  <!-- leichter weißer Schein hinter dem M -->
  <use href="#m" stroke="#fff" stroke-width="13" opacity=".4" filter="url(#mschein)"/>

  <!-- Schlagschatten auf dem Schild: das M schwebt darüber -->
  <use href="#m" stroke="#000" stroke-width="11.4" opacity=".7" transform="translate(1.8 3.4)" filter="url(#mschatten)"/>

  <!-- M wie der Schriftzug: gleichmäßiger dunkler Rand, orange Seele -->
  <use href="#m" stroke="url(#anthrazit)" stroke-width="9.6"/>
  <use href="#m" stroke="#000" stroke-opacity=".35" stroke-width="5"/>
  <g mask="url(#mkern)">
    <use href="#m" stroke="#b54a00" stroke-width="4.4"/>
    <use href="#m" stroke="url(#orange)" stroke-width="4.4" transform="translate(0 .45)"/>
  </g>
  <!-- Spiegelung der schräg stehenden Sonne: Bogen in der oberen Hälfte des M -->
  <g mask="url(#mform)">
    <ellipse cx="48" cy="-10" rx="42" ry="51" transform="rotate(-8 48 -10)" fill="url(#mspiegel)" filter="url(#mbogenweich)"/>
  </g>

  <!-- vier Dienste als eckige Lötflächen -->
  <g stroke="#1a1b1f" stroke-width="1.3">
    <rect x="1.5" y="57.5" width="9" height="9" rx="1.2" fill="url(#pMail)"/>
    <rect x="1.5" y="73.5" width="9" height="9" rx="1.2" fill="url(#pIdent)"/>
    <rect x="89.5" y="73.5" width="9" height="9" rx="1.2" fill="url(#pRout)"/>
    <rect x="89.5" y="57.5" width="9" height="9" rx="1.2" fill="url(#pAcc)"/>
  </g>
  <g fill="none" stroke="#fff" stroke-opacity=".5" stroke-width=".7">
    <rect x="3.3" y="59.3" width="5.4" height="5.4" rx=".6"/>
    <rect x="3.3" y="75.3" width="5.4" height="5.4" rx=".6"/>
    <rect x="91.3" y="75.3" width="5.4" height="5.4" rx=".6"/>
    <rect x="91.3" y="59.3" width="5.4" height="5.4" rx=".6"/>
  </g>
</svg>
