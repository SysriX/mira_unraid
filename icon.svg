<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="MIRA">
  <defs>
    <!-- Schild: kantig, dunkel, zwei Hälften mit Mittelgrat, oranger Rand -->
    <path id="schild" d="M50 6L83 16L79 52L50 78L21 52L17 16Z"/>
    <linearGradient id="links" x1="0" y1="6" x2="0" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4a4e57"/>
      <stop offset=".6" stop-color="#2e3036"/>
      <stop offset="1" stop-color="#1f2125"/>
    </linearGradient>
    <linearGradient id="rechts" x1="0" y1="6" x2="0" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#33363d"/>
      <stop offset=".6" stop-color="#202226"/>
      <stop offset="1" stop-color="#141518"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="6" x2="0" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffc04d"/>
      <stop offset=".5" stop-color="#ff9a1a"/>
      <stop offset="1" stop-color="#ff7000"/>
    </linearGradient>
    <linearGradient id="glanz" x1="0" y1="6" x2="0" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="anthrazit" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#555962"/>
      <stop offset="1" stop-color="#25272c"/>
    </linearGradient>
    <!-- Leiterbahnen: waagerecht von der Seite, dann 45° schräg hinter das Schild -->
    <path id="lMail"  d="M10.5 62H16L27 51"/>
    <path id="lIdent" d="M10.5 78H31L42 67"/>
    <path id="lRout"  d="M89.5 78H69L58 67"/>
    <path id="lAcc"   d="M89.5 62H84L73 51"/>
    <g id="bahnen"><use href="#lMail"/><use href="#lIdent"/><use href="#lRout"/><use href="#lAcc"/></g>
    <linearGradient id="pMail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fe0ff"/><stop offset=".5" stop-color="#4dc3ff"/><stop offset="1" stop-color="#1676b8"/></linearGradient>
    <linearGradient id="pIdent" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a8f0c5"/><stop offset=".5" stop-color="#3ddc84"/><stop offset="1" stop-color="#14864a"/></linearGradient>
    <linearGradient id="pRout" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset=".5" stop-color="#ffc233"/><stop offset="1" stop-color="#b9800a"/></linearGradient>
    <linearGradient id="pAcc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffaaaa"/><stop offset=".5" stop-color="#ff5a5a"/><stop offset="1" stop-color="#b52222"/></linearGradient>
    <path id="m" d="M36 54V31L41 26L50 37L59 26L64 31V54" fill="none" stroke-linecap="square" stroke-linejoin="miter" stroke-miterlimit="10"/>
  </defs>

  <!-- Leiterbahnen hinter dem Schild -->
  <g fill="none" stroke-linejoin="miter" stroke-linecap="butt">
    <use href="#bahnen" stroke="#141518" stroke-width="5" transform="translate(.7 1.2)"/>
    <use href="#bahnen" stroke="#2b2d33" stroke-width="5"/>
    <use href="#lMail" stroke="#4dc3ff" stroke-width="2.4"/>
    <use href="#lIdent" stroke="#3ddc84" stroke-width="2.4"/>
    <use href="#lRout" stroke="#ffc233" stroke-width="2.4"/>
    <use href="#lAcc" stroke="#ff5a5a" stroke-width="2.4"/>
    <use href="#bahnen" stroke="#fff" stroke-width=".6" opacity=".5" transform="translate(-.3 -.4)"/>
  </g>

  <!-- Schild: Tiefe (steht hervor), Hälften, Grat, Fase, oranger Rand -->
  <use href="#schild" fill="#0e0f11" transform="translate(1.4 2.4)" stroke="#0e0f11" stroke-width="4" stroke-linejoin="round"/>
  <use href="#schild" fill="#1a1b1f" transform="translate(.7 1.2)" stroke="#1a1b1f" stroke-width="4" stroke-linejoin="round"/>
  <use href="#schild" fill="#1f2125" stroke="url(#orange)" stroke-width="4" stroke-linejoin="round"/>
  <path d="M50 8.2L17.6 18L21.4 51.5L50 77Z" fill="url(#links)"/>
  <path d="M50 8.2L82.4 18L78.6 51.5L50 77Z" fill="url(#rechts)"/>
  <path d="M50 13L77 21.4L74 49.4L50 71L26 49.4L23 21.4Z" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="1" stroke-linejoin="round"/>
  <path d="M50 8V77" stroke="#fff" stroke-opacity=".18" stroke-width=".8"/>
  <path d="M50 8L17.6 18L19.6 36C30 32 40 31 50 31C60 31 70 32 80.4 36L82.4 18Z" fill="url(#glanz)"/>
  <use href="#schild" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width=".7" stroke-linejoin="round" transform="translate(-.3 -.5)"/>

  <!-- M wie der Schriftzug: Tiefe, Anthrazit-Rahmen, orange Seele -->
  <use href="#m" stroke="#0e0f11" stroke-width="10" transform="translate(.8 1.4)"/>
  <use href="#m" stroke="#80858f" stroke-width="10" transform="translate(-.35 -.55)"/>
  <use href="#m" stroke="url(#anthrazit)" stroke-width="9.6"/>
  <use href="#m" stroke="#a84400" stroke-width="3.6"/>
  <use href="#m" stroke="url(#orange)" stroke-width="3.2" transform="translate(.3 .5)"/>

  <!-- vier Dienste als eckige Lötflächen -->
  <g stroke="#2b2d33" stroke-width="1.8">
    <rect x="2.2" y="58.7" width="9" height="9" rx="1.2" fill="#0e0f11"/>
    <rect x="2.2" y="74.7" width="9" height="9" rx="1.2" fill="#0e0f11"/>
    <rect x="90.2" y="74.7" width="9" height="9" rx="1.2" fill="#0e0f11"/>
    <rect x="90.2" y="58.7" width="9" height="9" rx="1.2" fill="#0e0f11"/>
    <rect x="1.5" y="57.5" width="9" height="9" rx="1.2" fill="url(#pMail)"/>
    <rect x="1.5" y="73.5" width="9" height="9" rx="1.2" fill="url(#pIdent)"/>
    <rect x="89.5" y="73.5" width="9" height="9" rx="1.2" fill="url(#pRout)"/>
    <rect x="89.5" y="57.5" width="9" height="9" rx="1.2" fill="url(#pAcc)"/>
  </g>
  <g fill="none" stroke="#fff" stroke-opacity=".5" stroke-width=".7">
    <rect x="3.3" y="59.3" width="5.4" height="5.4" rx=".6"/>
    <rect x="3.3" y="75.3" width="5.4" height="5.4" rx=".6"/>
    <rect x="91.3" y="75.3" width="5.4" height="5.4" rx=".6"/>
    <rect x="91.3" y="59.3" width="5.4" height="5.4" rx=".6"/>
  </g>
</svg>
